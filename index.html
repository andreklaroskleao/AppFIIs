<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FII-Insight Ultra | Real-Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .badge { @apply px-2 py-0.5 rounded text-[10px] font-bold uppercase; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="border-b border-slate-800 p-4 sticky top-0 z-50 glass flex justify-between items-center">
        <h1 class="text-xl font-black text-emerald-400 italic">FII-INSIGHT <span class="text-white text-xs">ULTRA 4.0</span></h1>
        <div id="user-info" class="flex items-center gap-3"></div>
    </nav>

    <main class="container mx-auto p-4 lg:p-6">
        <div class="mb-6 overflow-hidden glass rounded-xl p-3 flex items-center gap-4">
            <span class="bg-red-500 text-white text-[10px] px-2 py-1 rounded animate-pulse">RADAR</span>
            <marquee id="news-ticker" class="text-sm text-slate-400 font-medium">Carregando últimas notícias e fatos relevantes dos seus FIIs...</marquee>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="glass p-5 rounded-2xl border-b-2 border-emerald-500">
                <p class="text-slate-500 text-[10px] font-bold uppercase">Patrimônio</p>
                <h2 id="total-patrimonio" class="text-2xl font-black">R$ 0,00</h2>
            </div>
            <div class="glass p-5 rounded-2xl border-b-2 border-blue-500">
                <p class="text-slate-500 text-[10px] font-bold uppercase">P/VP Médio Carteira</p>
                <h2 id="pvp-medio" class="text-2xl font-black text-blue-400">0.00</h2>
            </div>
            <div class="glass p-5 rounded-2xl border-b-2 border-purple-500">
                <p class="text-slate-500 text-[10px] font-bold uppercase">Próxima Data Com</p>
                <h2 id="proxima-datacom" class="text-2xl font-black text-purple-400">--/--</h2>
            </div>
            <div class="glass p-5 rounded-2xl border-b-2 border-orange-500">
                <p class="text-slate-500 text-[10px] font-bold uppercase">Renda Mensal</p>
                <h2 id="total-dividendos" class="text-2xl font-black text-orange-400 font-mono">R$ 0,00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
            <div class="xl:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="font-bold mb-4 text-sm">Gerenciar Ativo</h3>
                    <input type="text" id="ticker-input" placeholder="Ticker" class="w-full bg-slate-900 border-none rounded-lg p-3 mb-3 text-sm">
                    <div class="flex gap-2 mb-3">
                        <input type="number" id="qtd-input" placeholder="Qtd" class="w-1/2 bg-slate-900 border-none rounded-lg p-3 text-sm">
                        <input type="number" id="pm-input" placeholder="PM" class="w-1/2 bg-slate-900 border-none rounded-lg p-3 text-sm">
                    </div>
                    <button onclick="adicionarFundo()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-lg transition-all text-sm uppercase">Adicionar</button>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <canvas id="chartDistribuicao"></canvas>
                </div>
            </div>

            <div class="xl:col-span-3 glass rounded-2xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="bg-slate-900/50 text-slate-500 border-b border-slate-800">
                                <th class="p-4">FII</th>
                                <th class="p-4">PREÇO</th>
                                <th class="p-4">P/VP</th>
                                <th class="p-4">DATA COM</th>
                                <th class="p-4">DIVIDENDO (R$)</th>
                                <th class="p-4">YIELD (12M)</th>
                                <th class="p-4">POSIÇÃO</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="divide-y divide-slate-800/50">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
