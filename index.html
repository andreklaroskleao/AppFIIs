<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FII-Insight Pro | Gestão de Ativos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .card-valor { transition: transform 0.2s; }
        .card-valor:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="border-b border-slate-800 p-4 sticky top-0 z-50 glass">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-emerald-400 tracking-tighter">FII-INSIGHT</h1>
            <div id="user-info" class="flex items-center gap-4">
                </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 lg:p-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass p-6 rounded-2xl card-valor">
                <p class="text-slate-400 text-xs uppercase font-bold tracking-wider">Patrimônio Atual</p>
                <h2 id="total-patrimonio" class="text-2xl font-bold mt-1">R$ 0,00</h2>
            </div>
            <div class="glass p-6 rounded-2xl card-valor border-l-4 border-emerald-500">
                <p class="text-slate-400 text-xs uppercase font-bold tracking-wider">Dividendos Estimados</p>
                <h2 id="total-dividendos" class="text-2xl font-bold text-emerald-400 mt-1">R$ 0,00</h2>
                <p class="text-[10px] text-slate-500">*Baseado no último DY (0,8% med.)</p>
            </div>
            <div class="glass p-6 rounded-2xl card-valor">
                <p class="text-slate-400 text-xs uppercase font-bold tracking-wider">Qtd. de Ativos</p>
                <h2 id="qtd-ativos" class="text-2xl font-bold mt-1">0</h2>
            </div>
            <div class="glass p-6 rounded-2xl card-valor">
                <p class="text-slate-400 text-xs uppercase font-bold tracking-wider">Status Carteira</p>
                <div id="status-carteira" class="mt-2 text-sm font-bold px-2 py-1 bg-slate-700 rounded w-fit text-emerald-400 underline decoration-2">EM ALTA</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
            <div class="lg:col-span-1 glass p-6 rounded-2xl">
                <h3 class="text-lg font-bold mb-4">Novo Aporte</h3>
                <div class="space-y-4">
                    <input type="text" id="ticker-input" placeholder="Ticker (ex: HGLG11)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-emerald-500">
                    <div class="flex gap-2">
                        <input type="number" id="qtd-input" placeholder="Qtd" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
                        <input type="number" id="pm-input" placeholder="P. Médio" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                    <button onclick="adicionarFundo()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-4 rounded-xl transition-all uppercase tracking-widest shadow-lg shadow-emerald-500/20">
                        Salvar Ativo
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 glass p-6 rounded-2xl flex flex-col items-center">
                <h3 class="text-lg font-bold mb-4 self-start">Distribuição por Ativo</h3>
                <div class="w-full max-w-[400px]">
                    <canvas id="chartDistribuicao"></canvas>
                </div>
            </div>
        </div>

        <div class="glass rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase">
                    <tr>
                        <th class="p-4">Ativo</th>
                        <th class="p-4">Preço Atual</th>
                        <th class="p-4">Preço Teto (Bazin)</th>
                        <th class="p-4">Qtd</th>
                        <th class="p-4">Total</th>
                        <th class="p-4">Margem Segurança</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo" class="text-sm divide-y divide-slate-800">
                    </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
